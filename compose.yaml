services:
  book-organizer:
    image: ethanol2/book-organizer:latest
    container_name: book-organizer
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=${PORT}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY}
      - TOKEN_SECRET=${TOKEN_SECRET}

      - LIBRARY_PATH=/library
      - DOWNLOADS_PATH=/downloads
      - DATA_PATH=/data
    volumes:
      - ${DATA_PATH}:/data
      - ${LIBRARY_PATH}:/library
      - ${DOWNLOADS_PATH}:/downloads
